  <!-- Scroll-Reveal (siehe src/styles/reveal.css und src/main.jsx).
       Die Klasse dd-reveal muss VOR dem ersten Paint stehen, sonst würde der vorgerenderte,
       schon sichtbare Inhalt beim Laden des Bundles kurz verschwinden. Ohne JS oder bei
       prefers-reduced-motion bleibt sie weg und alles ist sofort sichtbar.
       ACHTUNG: Der Inhalt des Scripts ist per sha256 in der Content-Security-Policy
       (netlify.toml) freigegeben. Jede Änderung, auch an Leerzeichen, braucht einen neuen
       Hash. scripts/prerender.mjs bricht den Build ab, wenn Hash und Script nicht passen. -->
  <script>try{if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('dd-reveal')}catch(e){}</script>
  <!-- Sicherheitsnetz: Lädt das Modul-JS nicht, blendet CSS nach 3 s alles ein. Sobald
       src/main.jsx läuft, setzt es dd-reveal-live und übernimmt (oder nimmt dd-reveal
       wieder weg, wenn es zu spät kommt). Inhalte bleiben so nie dauerhaft unsichtbar. -->
  <style>@keyframes dd-reveal-failsafe{to{opacity:1;transform:none}}html.dd-reveal:not(.dd-reveal-live) [data-reveal]{animation:dd-reveal-failsafe .4s ease-out 3s forwards}</style>

  <!-- Statischer Spiegel des React-Formulars, damit Netlifys Build-Bot es registriert.
       Nur HIER stehen data-netlify und netlify-honeypot. Feldnamen MÜSSEN mit
       src/components/sections/SetupCheck.jsx und netlify/functions/submission-created.mjs
       übereinstimmen: name, email, shop, message, Honeypot bot-field. -->
  <form name="setup-check" data-netlify="true" netlify-honeypot="bot-field" action="/danke/" hidden>

    <input type="email" name="email">
    <input type="text" name="shop">
    <textarea name="message"></textarea>
    <input type="text" name="bot-field">
  </form>
