# digital-decision.at — Netlify config
[build]
  # vite build + SSR-Build + Prerendering von index.html (siehe package.json, scripts/prerender.mjs)
  command = "npm run build"
  publish = "dist"

# submission-created.mjs fires on every verified form submission (push via ntfy, ohne Personendaten)
[functions]
  directory = "netlify/functions"

# Security headers for every page
# Content-Security-Policy:
# - script-src: nur eigene Dateien plus das eine Inline-Script im <head> von index.html
#   (Scroll-Reveal), freigegeben per sha256. Ändert sich das Script, ändert sich der Hash;
#   scripts/prerender.mjs bricht den Build dann ab und nennt den neuen Hash.
#   JSON-LD (type="application/ld+json") wird nicht ausgeführt und braucht keine Freigabe.
# - style-src 'unsafe-inline': React setzt Styles als style-Attribute.
# - Keine externen Quellen: Fonts, Bilder und Formular laufen über die eigene Domain.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-/SvSxcVPqrt+7UUQe1eDYWR19nL7cmP9OQaxuzw6rrg='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Gehashte JS/CSS-Bundles aus dem Vite-Build (build.assetsDir = 'static'):
# Dateiname ändert sich mit dem Inhalt, also ein Jahr Cache.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Bilder und Logos aus public/assets behalten ihren Dateinamen, wenn sie neu erzeugt werden.
# Deshalb nur ein Tag, danach im Hintergrund eine Woche lang still aktualisieren.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Fonts ändern sich nie (bei einem Font-Update neuen Dateinamen vergeben).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
