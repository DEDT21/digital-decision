# digital-decision.at — Netlify config
[build]
  command = "npm run build"
  publish = "dist"

# submission-created.mjs fires on every verified form submission (push via ntfy)
[functions]
  directory = "netlify/functions"

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Static assets: cache aggressively (filenames are content-hashed or immutable)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
